events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    gzip          on;
    gzip_types    text/plain text/css application/json application/javascript;

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/m;

    server {
        listen 80;
        server_name _;

        # Let's Encrypt challenge
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Redirect HTTP → HTTPS (uncomment after SSL is set up)
        # return 301 https://$host$request_uri;

        # WhatsApp webhook (needs to stay on 80 until SSL configured)
        location /api/whatsapp/webhook {
            proxy_pass http://backend:8000/api/whatsapp/webhook;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/ {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://backend:8000/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 60s;
        }

        location / {
            proxy_pass http://frontend:80/;
            proxy_set_header Host $host;
        }
    }

    # HTTPS server (uncomment after certbot runs)
    # server {
    #     listen 443 ssl;
    #     server_name YOUR_DOMAIN;
    #     ssl_certificate     /etc/nginx/certs/live/YOUR_DOMAIN/fullchain.pem;
    #     ssl_certificate_key /etc/nginx/certs/live/YOUR_DOMAIN/privkey.pem;
    #
    #     location /api/ {
    #         proxy_pass http://backend:8000/api/;
    #         proxy_set_header Host $host;
    #         proxy_set_header X-Real-IP $remote_addr;
    #     }
    #     location / {
    #         proxy_pass http://frontend:80/;
    #     }
    # }
}
