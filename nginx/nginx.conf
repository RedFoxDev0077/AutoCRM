events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    gzip          on;
    gzip_types    text/plain text/css application/json application/javascript;

    # Rate limiting. Deliberately NOT applied to the webhook locations below —
    # Meta and Mercado Libre deliver in bursts and retry aggressively, and a
    # 30r/m cap would drop legitimate deliveries.
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/m;

    server {
        listen 80;
        server_name panel.indumentariasegura.com.ar;

        # Must be served over plain HTTP and must NOT be redirected, or
        # `certbot renew --webroot` cannot complete the HTTP-01 challenge.
        # Keep this block above the redirect.
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        server_name panel.indumentariasegura.com.ar;

        ssl_certificate     /etc/letsencrypt/live/panel.indumentariasegura.com.ar/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/panel.indumentariasegura.com.ar/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;

        # Uploads: supplier price lists (PDF) in the quoting tool, report CSVs.
        # nginx's default is 1 MB, which PDFs with logos easily exceed.
        client_max_body_size 20m;

        # Inbound webhooks — no rate limit (see note above). Longest-prefix
        # match wins in nginx, so these take precedence over /api/.
        location /api/whatsapp/webhook {
            proxy_pass http://backend:8000/api/whatsapp/webhook;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/ml/webhook {
            proxy_pass http://backend:8000/api/ml/webhook;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/kommo/webhook {
            proxy_pass http://backend:8000/api/kommo/webhook;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/google-ads/webhook {
            proxy_pass http://backend:8000/api/google-ads/webhook;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Meta requires a reachable privacy policy for the WhatsApp app review.
        location /privacy {
            proxy_pass http://backend:8000/privacy;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/ {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://backend:8000/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 60s;
        }

        location / {
            proxy_pass http://frontend:80/;
            proxy_set_header Host $host;
        }
    }
}
