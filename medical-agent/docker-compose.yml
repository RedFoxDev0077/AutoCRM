services:
  backend:
    build: ./backend
    container_name: medagent-backend
    restart: unless-stopped
    env_file: .env
    volumes:
      - studies_data:/data/studies
    expose:
      - "8000"

  frontend:
    build: ./frontend
    container_name: medagent-frontend
    restart: unless-stopped
    ports:
      - "8090:80"
    depends_on:
      - backend

volumes:
  studies_data:
