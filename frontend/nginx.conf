server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    # Behind the outer TLS proxy: keep directory redirects (/cotizador -> /cotizador/)
    # relative, so they don't point at http:// on the internal port.
    absolute_redirect off;

    # The quoting tool is a static app with its own index.html; don't fall
    # back to the SPA shell for it.
    location /cotizador/ {
        # Always revalidate: an old copy of these files is how the SPA shell
        # ended up answering /cotizador/ in browsers after the first deploy.
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /cotizador/index.html;
    }

    # The SPA shell must be revalidated too, or a deploy leaves browsers on an
    # old index.html. Hashed files under /assets/ keep normal caching.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /uploads/ {
        proxy_pass http://backend:8000/uploads/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
