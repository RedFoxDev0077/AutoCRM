name: CI

# Runs on every push and PR. The deploy workflow gates on this, so a red build
# here never reaches the VPS.
on:
  push:
    branches: ["**"]
  pull_request:
  # Lets you redeploy the current master without pushing a commit.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Byte-compile
        working-directory: backend
        run: python -m compileall -q app

      # app/main.py creates /app/data/uploads at import time and mounts it as a
      # StaticFiles route, so the path has to exist and be writable before the
      # import check below.
      - name: Prepare upload dir
        run: sudo mkdir -p /app/data/uploads && sudo chown -R "$USER" /app/data

      - name: Import check
        working-directory: backend
        # Catches broken imports, bad router wiring and Settings validation
        # errors that compileall alone won't surface.
        run: python -c "import app.main"

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # npm ci would be preferable, but there is no package-lock.json committed.
      - name: Install dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund

      - name: Typecheck and build
        working-directory: frontend
        run: npm run build

  images:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  deploy:
    name: Deploy to VPS
    needs: [backend, frontend, images]
    if: >-
      github.ref == 'refs/heads/master' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    # Never let two deploys overlap; queue instead of cancelling so a deploy
    # is never interrupted half-way through a rebuild.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy
        env:
          HOST: ${{ secrets.VPS_HOST }}
          DEPLOY_USER: ${{ secrets.VPS_USER }}
          SHA: ${{ github.sha }}
        # The heredoc is QUOTED (<<'REMOTE') so nothing expands on the runner —
        # the script arrives verbatim. The one value we need from the runner is
        # passed as an environment variable on the remote command line.
        run: |
          ssh -o BatchMode=yes "$DEPLOY_USER@$HOST" "TARGET_SHA='$SHA' bash -s" <<'REMOTE'
          set -euo pipefail
          cd /opt/autocrm

          PREV=$(git rev-parse HEAD)
          echo "current: $PREV  ->  target: $TARGET_SHA"

          rollback() {
            echo "::error::deploy failed - rolling back to $PREV"
            git reset --hard "$PREV"
            docker compose up -d --build --remove-orphans || true
          }

          git fetch --prune origin
          git reset --hard "$TARGET_SHA"

          # Past this point the working tree is already on the new commit, so
          # any failure must restore the previous one. Without this trap `set -e`
          # would abort before the rollback could run.
          trap rollback ERR

          # Validate nginx in a throwaway container before it can take the live
          # site down. Same mounts as the real service, and on the compose
          # network so the backend/frontend upstreams resolve.
          docker run --rm \
            --network autocrm_autocrm \
            -v /opt/autocrm/nginx/nginx.conf:/etc/nginx/nginx.conf:ro \
            -v /etc/letsencrypt:/etc/letsencrypt:ro \
            -v /var/www/certbot:/var/www/certbot:ro \
            nginx:alpine nginx -t

          docker compose up -d --build --remove-orphans

          # nginx.conf is a single-file bind mount: git replaces the file, and a
          # running container keeps reading the old one until it is restarted.
          if ! git diff --quiet "$PREV" "$TARGET_SHA" -- nginx/nginx.conf; then
            echo "nginx.conf changed - restarting nginx"
            docker compose restart nginx
          fi

          healthy=0
          for i in $(seq 1 20); do
            if docker compose exec -T backend python -c \
                 "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=3).status==200 else 1)" 2>/dev/null; then
              healthy=1
              echo "backend healthy after ~$((i*10))s"
              break
            fi
            sleep 10
          done

          # Disarm the trap so rollback runs exactly once, not twice.
          trap - ERR

          if [ "$healthy" -ne 1 ]; then
            echo "::error::backend did not become healthy within 200s"
            rollback
            exit 1
          fi

          echo "deployed $(git rev-parse --short HEAD)"
          REMOTE

      - name: Prune stale images
        if: always()
        continue-on-error: true
        run: |
          ssh -o BatchMode=yes "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            'docker image prune -f --filter "until=168h"'
