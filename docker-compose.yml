services:
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: autocrm
      POSTGRES_PASSWORD: autocrm
      POSTGRES_DB: autocrm
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [autocrm]

  redis:
    image: redis:7-alpine
    restart: always
    volumes:
      - redis_data:/data
    networks: [autocrm]

  backend:
    build: ./backend
    restart: always
    env_file: .env
    depends_on: [postgres, redis]
    networks: [autocrm]
    expose: ["8000"]
    volumes:
      # ML/Meta OAuth tokens, business context and uploaded images live here.
      # Bind mount (not a named volume) to match what production already runs.
      - ./data:/app/data

  frontend:
    build: ./frontend
    restart: always
    depends_on: [backend]
    networks: [autocrm]
    expose: ["80"]

  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # Certs live on the host so nginx and certbot share one location.
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - certbot_data:/var/www/certbot:ro
    depends_on: [frontend, backend]
    networks: [autocrm]

  certbot:
    image: certbot/certbot
    volumes:
      # MUST match the path nginx reads from, or renewals land somewhere
      # nginx never looks and the live cert silently expires.
      - /etc/letsencrypt:/etc/letsencrypt
      - certbot_data:/var/www/certbot
    entrypoint: >
      sh -c "trap exit TERM; while :; do
        certbot renew --webroot -w /var/www/certbot --quiet;
        sleep 12h & wait $${!}; done"

volumes:
  postgres_data:
  redis_data:
  certbot_data:

networks:
  autocrm:
    driver: bridge
