services:
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: autocrm
      POSTGRES_PASSWORD: autocrm
      POSTGRES_DB: autocrm
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [autocrm]

  redis:
    image: redis:7-alpine
    restart: always
    volumes:
      - redis_data:/data
    networks: [autocrm]

  backend:
    build: ./backend
    restart: always
    env_file: .env
    depends_on: [postgres, redis]
    networks: [autocrm]
    expose: ["8000"]
    volumes:
      # ML/Meta OAuth tokens, business context and uploaded images live here.
      # Bind mount (not a named volume) to match what production already runs.
      - ./data:/app/data

  frontend:
    build: ./frontend
    restart: always
    depends_on: [backend]
    networks: [autocrm]
    expose: ["80"]

  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # Certs live on the host, written by the host's certbot.
      - /etc/letsencrypt:/etc/letsencrypt:ro
      # ACME HTTP-01 webroot. The host certbot writes challenge files here and
      # nginx serves them from /.well-known/acme-challenge/ on port 80.
      - /var/www/certbot:/var/www/certbot:ro
    depends_on: [frontend, backend]
    networks: [autocrm]

# NOTE: there is deliberately no certbot service here.
#
# The live certificate is owned by the HOST certbot (/usr/bin/certbot) and
# renewed by certbot.timer. A containerised certbot fought it over
# /etc/letsencrypt and renewed into a path nginx never read.
#
# The renewal authenticator is `webroot` (see /etc/letsencrypt/renewal/*.conf),
# writing to /var/www/certbot, which nginx serves read-only. It must NOT be
# `standalone`: that binds :80 itself, and nginx already holds :80, so every
# renewal fails with "Could not bind TCP port 80".

volumes:
  postgres_data:
  redis_data:

networks:
  autocrm:
    driver: bridge
